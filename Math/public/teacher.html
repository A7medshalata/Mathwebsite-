<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard · MathHub</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <h1>Teacher <span class="hl">dashboard</span></h1>
  <div id="msg"></div>
  <div class="stats" id="stats"></div>

  <section id="pendingBox"></section>

  <h2 style="margin-top:28px">Students</h2>
  <div class="tablewrap"><table>
    <thead><tr><th>Student</th><th>Status</th><th>Answered</th><th>Accuracy</th><th>Checkpoints</th><th>Last activity</th><th></th></tr></thead>
    <tbody id="students"></tbody>
  </table></div>

  <section id="detail"></section>

  <div class="grid" style="margin-top:32px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <section>
      <h2>Hardest lessons</h2>
      <div class="tablewrap"><table><thead><tr><th>Lesson</th><th>Answers</th><th>Accuracy</th></tr></thead><tbody id="hard"></tbody></table></div>
    </section>
    <section>
      <h2>Answers per day (14 days)</h2>
      <div class="panel" style="padding-bottom:36px"><div class="spark" id="spark"></div></div>
    </section>
  </div>

  <section class="panel" style="margin-top:32px;max-width:420px">
    <h3>Change my password</h3>
    <form id="pw">
      <label class="field">New password <input type="password" name="p" minlength="6" autocomplete="new-password" required></label>
      <button class="btn small" type="submit">Save password</button>
    </form>
  </section>
</main>
<script src="/app.js"></script>
<script>
  startPage('teacher', 'teacher.html');
  let data;

  const when = (t) => (t ? esc(t.replace('T', ' ').slice(0, 16)) : '<span class="muted">never</span>');

  function render() {
    const t = data.totals;
    $('#stats').innerHTML = [
      [t.students, 'Students'], [t.active, 'Active accounts'], [t.pending, 'Waiting for activation'], [t.answers, 'Answers given'],
    ].map(([n, l]) => `<div class="stat"><b>${n}</b>${l}</div>`).join('');

    const pending = data.students.filter((s) => !s.active);
    $('#pendingBox').innerHTML = pending.length ? `<div class="panel" style="margin-bottom:8px">
      <h2>Accounts waiting for activation</h2>
      ${pending.map((s) => `<div class="row spread" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <span><b>${esc(s.full_name)}</b> <span class="muted">@${esc(s.username)} · signed up ${when(s.created_at)}</span></span>
        <button class="btn small good" data-act="1" data-id="${s.id}">Activate</button></div>`).join('')}
    </div>` : '';

    $('#students').innerHTML = data.students.length ? data.students.map((s) => `<tr>
      <td><b>${esc(s.full_name)}</b><br><span class="muted">@${esc(s.username)}</span></td>
      <td><span class="chip ${s.active ? 'good' : 'warn'}">${s.active ? 'Active' : 'Pending'}</span></td>
      <td>${s.answered}</td>
      <td style="min-width:130px">${s.accuracy === null ? '<span class="muted">No data</span>' : barHtml(s.accuracy) + `<span class="muted">${s.accuracy}%</span>`}</td>
      <td>${s.checkpoints}</td>
      <td>${when(s.last_activity)}</td>
      <td class="row" style="gap:6px;flex-wrap:nowrap">
        <button class="btn small alt" data-view="${s.id}">Details</button>
        <button class="btn small ${s.active ? 'danger' : 'good'}" data-act="${s.active ? 0 : 1}" data-id="${s.id}">${s.active ? 'Deactivate' : 'Activate'}</button>
      </td></tr>`).join('') : '<tr><td colspan="7"><div class="empty" style="border:0">No students have registered yet.</div></td></tr>';

    $('#hard').innerHTML = data.hardestLessons.length ? data.hardestLessons.map((l) => `<tr>
      <td>${esc(l.title)}<br><span class="muted">${esc(l.book)}</span></td><td>${l.attempts}</td>
      <td style="min-width:110px">${barHtml(l.accuracy)}<span class="muted">${l.accuracy}%</span></td></tr>`).join('')
      : '<tr><td colspan="3" class="muted">No answers yet.</td></tr>';

    const max = Math.max(1, ...data.daily.map((d) => d.answers));
    $('#spark').innerHTML = data.daily.length ? data.daily.map((d) =>
      `<div style="height:${Math.max(4, 100 * d.answers / max)}%" title="${esc(d.day)}: ${d.answers} answers from ${d.students} students"><span>${esc(d.day.slice(5))}</span></div>`).join('')
      : '<span class="muted">No activity yet.</span>';
  }

  async function load() { data = await api('/teacher/overview'); render(); }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    try {
      if (b.dataset.act !== undefined) {
        await api(`/teacher/students/${b.dataset.id}/active`, { active: b.dataset.act === '1' });
        toast(b.dataset.act === '1' ? 'Account activated' : 'Account deactivated');
        await load();
      } else if (b.dataset.view) {
        const d = await api('/teacher/students/' + b.dataset.view);
        $('#detail').innerHTML = `<div class="panel" style="margin-top:24px">
          <div class="row spread"><h2>${esc(d.student.full_name)} <span class="muted">@${esc(d.student.username)}</span></h2>
            <span class="row"><button class="btn small alt" id="resetpw" data-id="${d.student.id}">Reset password</button>
            <button class="btn small alt" id="closed">Close</button></span></div>
          <h3>Weak lessons</h3>
          ${d.weak.length ? d.weak.map((w) => `<span class="chip bad" style="margin:0 6px 6px 0">${esc(w.title)} · ${w.accuracy}%</span>`).join('') : '<p class="muted">None right now.</p>'}
          <h3 style="margin-top:16px">Accuracy by lesson</h3>
          ${d.byLesson.length ? `<div class="tablewrap"><table><thead><tr><th>Lesson</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>
            ${d.byLesson.map((l) => `<tr><td>${esc(l.lesson)}<br><span class="muted">${esc(l.book)}</span></td><td>${l.correct}/${l.attempts}</td><td style="min-width:120px">${barHtml(l.accuracy)}<span class="muted">${l.accuracy}%</span></td></tr>`).join('')}
            </tbody></table></div>` : '<p class="muted">No answers yet.</p>'}
          <h3 style="margin-top:16px">Weekly checkpoints</h3>
          ${d.checkpoints.length ? d.checkpoints.map((c) => `<span class="chip" style="margin-right:6px">${esc(c.week_key)}: ${c.score}/${c.total}</span>`).join('') : '<p class="muted">None taken yet.</p>'}
        </div>`;
        $('#closed').onclick = () => { $('#detail').innerHTML = ''; };
        $('#resetpw').onclick = async () => {
          const p = prompt('New password for this student (6+ characters):');
          if (!p) return;
          try { await api(`/teacher/students/${d.student.id}/reset-password`, { password: p }); toast('Password changed'); }
          catch (err) { toast(err.message); }
        };
        $('#detail').scrollIntoView({ behavior: 'smooth' });
      }
    } catch (err) { toast(err.message); }
  });

  $('#pw').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('/teacher/change-password', { password: new FormData(e.target).get('p') }); toast('Password saved'); e.target.reset(); }
    catch (err) { toast(err.message); }
  };

  load().catch((e) => showMsg($('#msg'), e.message));
</script>
</body>
</html>
